# config/packages/framework.yaml
framework:
    secret: '%env(APP_SECRET)%'

    # Start sessions normally
    session:
        # Use secure cookies automatically (works with HTTPS/ngrok)
        cookie_secure: auto
        # Prevent CSRF/session issues with external URLs
        cookie_samesite: lax

    # Trust ngrok proxy so HTTPS and forwarded headers work
    trusted_proxies: '127.0.0.1,REMOTE_ADDR'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto']

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
